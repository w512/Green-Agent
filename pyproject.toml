[project]
name = "pyagent"
version = "0.1.0"
description = "Small, modular coding-agent harness for Python"
requires-python = ">=3.11"
dependencies = ["openai>=1.50"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[tool.uv]
package = false

# Used by the agent's own `check` tool when it works on this repository.
[tool.pyagent]
check = "ruff check . && ruff format --check . && mypy && pytest -q"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["agent", "tools", "cli.py", "start.py"]
strict = true
ignore_missing_imports = true
