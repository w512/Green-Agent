[project]
name = "pyagent"
version = "0.1.0"
description = "Small, modular coding-agent harness for Python"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["openai>=1.50"]

[project.optional-dependencies]
tui = [
    "textual>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "textual>=1.0",
]

[tool.uv]
package = false

# Used by the agent's own `check` tool when it works on this repository.
[tool.pyagent]
check = "ruff check . && ruff format --check . && mypy && pytest -q"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["agent", "tools", "cli.py", "start.py", "tui.py"]
strict = true
ignore_missing_imports = true
